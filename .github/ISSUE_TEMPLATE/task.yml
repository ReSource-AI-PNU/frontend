name: 작업 (Task)
description: 설계안의 한 조각을 구현하거나 조사하는 작업
title: "[영역] 작업 제목"
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 이 작업이 끝나면 무엇이 가능해지는가. 설계안의 어느 단계·화면에 해당하는가.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 체크리스트로 나눈다. 항목 하나가 반나절을 넘기면 더 쪼갠다.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 리뷰어가 확인할 수 있는 조건. 테스트, 화면, 파일, 수치.
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: 선행 작업
      placeholder: "#12, #15 (없으면 '없음')"
  - type: textarea
    id: refs
    attributes:
      label: 참고
      description: 설계안 섹션, 데이터 출처, 외부 문서 링크
