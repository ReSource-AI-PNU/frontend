name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · 타입 검사 · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 빌드가 Auth.js 설정을 읽으므로 넣는 검사용 값이다. 실제 비밀 값이 아니다.
      AUTH_SECRET: ci-build-check-only
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: lint
        run: npm run lint

      # next-env.d.ts와 라우트 타입(PageProps 등)은 git에 없다. 먼저 만들어야 tsc가 통과한다.
      - name: 타입 검사
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: 단위 테스트
        run: |
          npm run test:c-questions
          for t in tests/*.test.ts; do node --test "$t"; done

      - name: build
        run: npm run build

  e2e:
    name: 브라우저로 끝까지 눌러 보기 (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 검사용 값이다. 실제 비밀 값이 아니다.
      AUTH_SECRET: ci-e2e-check-only-0123456789abcdef
      AUTH_TRUST_HOST: "true"
      AUTH_DEV_LOGIN: "true"
      AUTH_URL: http://localhost:3000
      # 브라우저는 프런트의 통로를 부르고, 통로가 백엔드 로컬 서버(header 모드)를 부른다
      NEXT_PUBLIC_API_BASE: /api/v3
      V3_BACKEND_URL: http://localhost:8000/api/v3
      V3_AUTH: header
      BACKEND_DIR: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v7

      # 백엔드는 표준 라이브러리 로컬 서버(app.v3.devserver)를 쓴다. 패키지 설치가 필요 없다.
      # 백엔드 저장소가 비공개라 읽기 전용 토큰이 필요하다: 저장소 Settings → Secrets → Actions에 BACKEND_READ_TOKEN
      # (backend 저장소의 Contents: Read-only만 준 fine-grained 토큰). 없으면 검증 미완료로 실패 처리한다.
      # 같은 이름의 브랜치가 백엔드에 있으면 그것을, 없으면 main을 받는다(양쪽을 함께 바꾸는 PR을 위해).
      - name: 백엔드 받기
        id: backend
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BACKEND_READ_TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}
        run: |
          if [ -z "$BACKEND_READ_TOKEN" ]; then
            echo "::error::BACKEND_READ_TOKEN이 없어 E2E를 실행하지 못했습니다. 검증 미완료입니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          url="https://x-access-token:${BACKEND_READ_TOKEN}@github.com/ReSource-AI-PNU/backend.git"
          if git ls-remote --exit-code --heads "$url" "$HEAD_REF" >/dev/null 2>&1; then ref="$HEAD_REF"; else ref=main; fi
          echo "backend ref: $ref"
          git clone --quiet --depth 1 --branch "$ref" "$url" backend
          git -C backend remote set-url origin https://github.com/ReSource-AI-PNU/backend.git
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.backend.outputs.ready == 'true'
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        if: steps.backend.outputs.ready == 'true'
        with:
          node-version: 26
          cache: npm

      - name: 의존성 설치
        if: steps.backend.outputs.ready == 'true'
        run: npm ci

      - name: 브라우저 설치
        if: steps.backend.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      # 배포 이미지(Dockerfile)와 같은 배치: standalone 출력에 정적 파일과 public을 붙인다
      - name: build
        if: steps.backend.outputs.ready == 'true'
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: E2E
        if: steps.backend.outputs.ready == 'true'
        run: npm run test:e2e

      - name: 실패 기록 올리기
        if: failure() && steps.backend.outputs.ready == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

